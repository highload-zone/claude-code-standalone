name: Docker build & publish

# Builds three agent images (claude, codex, opencode) for amd64 + arm64 from one
# Dockerfile (--target <agent>) and publishes one multi-arch manifest per agent
# to GHCR. Uses the built-in GITHUB_TOKEN (no extra secrets). On pull_request it
# only BUILDS (verification, no push); on push to main and on version tags it
# PUBLISHES to ghcr.io/<owner>/<repo>.
#
# Tags per agent:
#   <agent>                     (main)              e.g. :codex
#   latest                      (main, claude only) alias of :claude
#   <ver>, <major.minor>, <major> on a v* tag, suffixed with the agent (e.g. :1.2.3-codex)
#   sha-<short>                 every build
#
# Supported archs are limited by the GitHub-release binaries → amd64 + arm64:
# RTK (x86_64-musl, aarch64-gnu) and codebase-memory-mcp (linux amd64/arm64 only).
# Each arch builds natively on its own runner, then digests are merged into one
# manifest (no QEMU). RTK arm64 is gnu-linked and needs glibc >= 2.39 (Debian
# trixie base provides 2.41).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.agent }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, opencode]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login only when we will push (not on pull_request — fork PRs lack write).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Auto-retry: the native ARM runner intermittently terminates the job during
      # base-image pull/push (transient infra, not a build error). nick-fields/retry
      # re-runs the whole `docker buildx build` (pull+build+push) up to 3 times.
      # PR: build-only verification (type=cacheonly, no push).
      # push/tag: push by digest; the manifest is assembled in the merge job.
      - name: Build (with retry; push by digest on non-PR)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            docker buildx build \
              --target "${{ matrix.agent }}" \
              --platform "${{ matrix.platform }}" \
              --cache-from "type=gha,scope=${{ matrix.agent }}-${{ matrix.arch }}" \
              --cache-to "type=gha,mode=max,scope=${{ matrix.agent }}-${{ matrix.arch }}" \
              --metadata-file "/tmp/meta-${{ matrix.agent }}-${{ matrix.arch }}.json" \
              ${{ github.event_name != 'pull_request' && format('--output type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || '--output type=cacheonly' }} \
              .

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="$(jq -r '."containerimage.digest"' "/tmp/meta-${{ matrix.agent }}-${{ matrix.arch }}.json")"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.agent }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish manifest (${{ matrix.agent }})
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, opencode]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.agent }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the tag list for this agent from the git ref. Kept explicit rather
      # than via docker/metadata-action because every tag carries the agent suffix
      # (and :latest is reserved for the claude image).
      - name: Compute tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          agent="${{ matrix.agent }}"
          tags="${image}:sha-${GITHUB_SHA::7}-${agent}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
            tags="${tags} ${image}:${v}-${agent} ${image}:${major}.${minor}-${agent} ${image}:${major}-${agent}"
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags} ${image}:${agent}"
            [ "${agent}" = "claude" ] && tags="${tags} ${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Create & push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' ${{ steps.tags.outputs.tags }}) \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.agent }}"